plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'application'
}

group = 'javaproject'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.jsoup:jsoup:1.19.1'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}
application {
	// Your Spring Boot entrypoint
	mainClass = 'javaproject.webcrawler.WebcrawlerApplication'
}

bootJar {
	// embed a Unix launch script stub so “java -jar” just works
	launchScript()
}

// === UI fat‑jar task ===
tasks.register('uiFatJar', Jar) {
	group = 'build'
	description = 'Assembles a fat jar for the Swing UI'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	archiveBaseName.set('webcrawler-ui')
	archiveVersion.set(version)

	manifest {
		// **use plain ASCII hyphen** in the key
		attributes(
				'Main-Class': 'javaproject.webcrawler.ui.CrawlerUI'
		)
	}

	// include your compiled classes
	from(sourceSets.main.output)

	// unpack & include all runtime dependencies
	dependsOn(configurations.runtimeClasspath)
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
